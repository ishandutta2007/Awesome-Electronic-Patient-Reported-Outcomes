<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="accentGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Card Glassmorphism Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <style>
      @keyframes floatParticle {
        0% { transform: translateY(0px) scale(1); opacity: 0.3; }
        50% { transform: translateY(-15px) scale(1.1); opacity: 0.8; }
        100% { transform: translateY(0px) scale(1); opacity: 0.3; }
      }
      @keyframes pulseRing {
        0% { r: 120px; opacity: 0.4; }
        50% { r: 160px; opacity: 0.1; }
        100% { r: 120px; opacity: 0.4; }
      }
      @keyframes waveLine {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 1000; }
      }
      .particle { animation: floatParticle 6s ease-in-out infinite; }
      .p2 { animation-delay: 2s; }
      .p3 { animation-delay: 4s; }
      .ring { animation: pulseRing 8s ease-in-out infinite; }
      .title-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; }
      .subtitle-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 500; }
    </style>
  </defs>

  <!-- Base Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16" />

  <!-- Background Grid Pattern -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="450" y1="0" x2="450" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="750" y1="0" x2="750" y2="400" />
    <line x1="900" y1="0" x2="900" y2="400" />
    <line x1="1050" y1="0" x2="1050" y2="400" />
  </g>

  <!-- Dynamic Glowing Orbs in Background -->
  <circle cx="1000" cy="100" r="140" fill="#6366f1" opacity="0.15" filter="url(#glow)" />
  <circle cx="1000" cy="100" class="ring" fill="none" stroke="#8b5cf6" stroke-width="1.5" opacity="0.3" />
  <circle cx="150" cy="320" r="120" fill="#06b6d4" opacity="0.12" filter="url(#glow)" />

  <!-- Background Dynamic Medical ECG / Signal Line -->
  <path d="M 50 340 Q 200 340 300 340 T 450 340 L 470 300 L 490 380 L 510 270 L 530 360 L 550 340 L 700 340 T 900 340 L 1150 340" 
        fill="none" stroke="url(#cyanGrad)" stroke-width="2" opacity="0.35" stroke-dasharray="10 5" />

  <!-- Floating Dynamic Tech Particles -->
  <circle cx="950" cy="180" r="6" fill="#ec4899" class="particle p1" filter="url(#glow)" />
  <circle cx="1050" cy="260" r="8" fill="#3b82f6" class="particle p2" filter="url(#glow)" />
  <circle cx="850" cy="120" r="5" fill="#06b6d4" class="particle p3" filter="url(#glow)" />
  <circle cx="200" cy="100" r="7" fill="#8b5cf6" class="particle p2" filter="url(#glow)" />

  <!-- Main Content Foreground Box (Ensures text stays crystal clear & in front) -->
  <rect x="60" y="60" width="1080" height="280" rx="16" fill="url(#glassGrad)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" filter="url(#dropShadow)" />

  <!-- Top Decorative Pill / Badge -->
  <g transform="translate(100, 95)">
    <rect width="320" height="32" rx="16" fill="url(#accentGrad1)" opacity="0.9" />
    <text x="160" y="21" class="subtitle-text" font-size="13" fill="#ffffff" text-anchor="middle" letter-spacing="1">
      HEALTHCARE &amp; CLINICAL TRIALS
    </text>
  </g>

  <!-- Main Title -->
  <text x="100" y="185" class="title-text" font-size="44" fill="#ffffff" filter="url(#dropShadow)">
    Awesome Electronic Patient-Reported Outcomes
  </text>
  
  <text x="100" y="232" class="title-text" font-size="34" fill="url(#cyanGrad)">
    (ePRO &amp; eCOA Ecosystem)
  </text>

  <!-- Subtitle -->
  <text x="100" y="285" class="subtitle-text" font-size="18" fill="#94a3b8">
    Curated SaaS Platforms, Open-Source EDC Systems, FHIR SDC Renderers &amp; DCT Tools
  </text>

  <!-- Right Decorative Pulse Nodes (Visual Accent) -->
  <g transform="translate(980, 200)">
    <rect x="-60" y="-50" width="120" height="100" rx="12" fill="#0f172a" fill-opacity="0.6" stroke="#6366f1" stroke-width="1.5" />
    <!-- Mini Heart / Vital Icon -->
    <path d="M -15 -10 C -25 -25 -40 0 0 20 C 40 0 25 -25 15 -10 C 10 -5 5 0 0 5 C -5 0 -10 -5 -15 -10 Z" fill="url(#accentGrad1)" transform="scale(0.8)" />
    <text x="0" y="32" class="subtitle-text" font-size="12" fill="#cbd5e1" text-anchor="middle">ePRO Clinical</text>
  </g>
</svg>
